# HR Receipt v2 — attach the Holt Renfrew receipt number to a COMPLETED Shopify
# POS order (post-purchase screen or any order's action menu), and look orders up
# by it from the home tile. No webhook / server involved: everything is written
# and read through POS Direct API access.
#
# 2026-01: native-screen navigation needs >= 2025-10; 2026-04+ changed the camera
# scanner to a full-screen overlay. Re-test before bumping.
api_version = "2026-01"

[[extensions]]
type = "ui_extension"
name = "HR Receipt"
handle = "hr-receipt"
uid = "a7403e32-3da3-b7a6-cbb5-7768a800676aba816f25"
description = "Attach a Holt Renfrew receipt number to a POS order and look orders up by it for returns/exchanges."

# --- Home screen: find an order by HR receipt # -----------------------------
[[extensions.targeting]]
target = "pos.home.tile.render"
module = "./src/Tile.jsx"

[[extensions.targeting]]
target = "pos.home.modal.render"
module = "./src/FindModal.jsx"

# --- Post-purchase screen (right after checkout): add HR receipt # ----------
[[extensions.targeting]]
target = "pos.purchase.post.block.render"
module = "./src/PostPurchaseBlock.jsx"

[[extensions.targeting]]
target = "pos.purchase.post.action.render"
module = "./src/AttachModal.jsx"

# --- Order details (Orders > any order): add/edit HR receipt # ---------------
[[extensions.targeting]]
target = "pos.order-details.action.menu-item.render"
module = "./src/OrderMenuItem.jsx"

[[extensions.targeting]]
target = "pos.order-details.action.render"
module = "./src/AttachModal.jsx"

[[extensions.targeting]]
target = "pos.order-details.block.render"
module = "./src/Block.jsx"
